name: ingest
# 매일 03:00 KST(18:00 UTC) 공공 API 수집 → 정규화 → 지식 DB upsert → 검증 → 빌드 → 커밋
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline (fetch → normalize → upsert → validate → build → wiki)
        id: pipeline
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          DATAGOKR_KEY: ${{ secrets.DATAGOKR_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOTCHIMA_CHECK_LINKS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python -m scripts.run_pipeline

      - name: Unit tests
        run: python -m unittest discover -s tests


      - name: Commit generated artifacts
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "hop-bot"
          git config user.email "bot@happy-our-planning"
          git add knowledge/ web/public/data/ web/public/events/ web/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(ingest): daily update $(date -u +%F)"
          git push

      - name: Report failed ingest
        if: ${{ failure() }}
        run: |
          {
            echo "## Ingest failed"
            echo "Pipeline outcome: ${{ steps.pipeline.outcome }}"
            echo "Published data was not changed by this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload collection diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ingest-collection-status
          path: knowledge/sources/collection-status.json
          if-no-files-found: ignore
          retention-days: 7
